# Deploys bella.pathwayanalytics.com with SST whenever main changes.
#
# One-off setup (see README "Automatic deployment"):
#   1. In AWS, create a GitHub OIDC identity provider and a deploy role.
#   2. In GitHub, add AWS_DEPLOY_ROLE_ARN (the role's ARN) as a repository
#      variable or secret. Either works.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage (production = bella.pathwayanalytics.com, anything else = bella-<stage>.pathwayanalytics.com)
        default: production
      action:
        description: deploy, or remove (non-production stages only)
        type: choice
        options: [deploy, remove]
        default: deploy

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: deploy-${{ inputs.stage || 'production' }}
  cancel-in-progress: false

permissions:
  id-token: write # lets GitHub sign in to AWS without stored keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Deploy
        if: ${{ (inputs.action || 'deploy') == 'deploy' }}
        run: pnpm exec sst deploy --stage "$STAGE"
        env:
          STAGE: ${{ inputs.stage || 'production' }}

      - name: Remove stage
        if: ${{ inputs.action == 'remove' && inputs.stage != 'production' }}
        run: pnpm exec sst remove --stage "$STAGE"
        env:
          STAGE: ${{ inputs.stage }}
